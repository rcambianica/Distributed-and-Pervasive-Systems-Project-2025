syntax = "proto3";
package it.unimi.grpc;

enum PlantStatus {
  IDLE = 0;
  BUSY = 1;
}

message AvailabilityRequest {
  int32 senderPlantId = 1;
  int64 requestId = 2;
}

message AvailabilityResponse  {
  int32 responderPlantId = 1;
  int64 requestId = 2;
  PlantStatus status = 3;
}

service PlantCoordinationService  {
  rpc checkAvailability(AvailabilityRequest) returns (AvailabilityResponse);
}
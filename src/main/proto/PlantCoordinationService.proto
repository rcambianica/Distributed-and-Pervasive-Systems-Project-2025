syntax = "proto3";
package it.unimi.grpc;


message ElectionMessage {
  int64 requestId = 1;
  int32 candidateId = 2;
  float bid = 3;
}

message ElectedMessage {
  int64 requestId = 1;
  int32 winnerId = 2;
}

message Empty {}

message JoinNotification  {
  int32 plantId = 1;
  int32 port = 2;
}

message ExitNotification  {
  int32 plantId = 1;
}

message JoinAck {
  int32 plantId = 1;
  int32 port = 2;
}

service PlantCoordinationService  {
  rpc election(ElectionMessage) returns (Empty);
  rpc elected(ElectedMessage) returns (Empty);
  rpc notifyJoin(JoinNotification) returns (JoinAck);
  rpc notifyExit(ExitNotification) returns (Empty);
}